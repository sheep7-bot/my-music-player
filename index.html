<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>我的音乐收藏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   歸藏 Magazine · 墨水经典 Theme
   ========================================================================== */
:root {
  --ink: #0a0a0b;
  --ink-rgb: 10,10,11;
  --paper: #f1efea;
  --paper-rgb: 241,239,234;
  --paper-tint: #e8e5de;
  --ink-tint: #18181a;
  --accent: var(--paper);
  --accent-dim: rgba(var(--paper-rgb),0.15);
  --mono: "IBM Plex Mono",ui-monospace,monospace;
  --serif-en: "Playfair Display",Georgia,serif;
  --serif-zh: "Noto Serif SC",source-han-serif-sc,serif;
  --sans: "Noto Sans SC","Inter",system-ui,-apple-system,sans-serif;
  --glass-bg: rgba(var(--paper-rgb),0.04);
  --glass-border: rgba(var(--paper-rgb),0.08);
  --shadow-deep: 0 40px 120px rgba(0,0,0,0.7);
  --radius-sm: 4px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;overflow:hidden;
  font-family:var(--mono);
  background:var(--ink);
  color:var(--paper);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  user-select:none;-webkit-user-select:none;
}

/* ==========================================================================
   Fluid Canvas Background (歸藏 style)
   ========================================================================== */
canvas#fluid-bg{
  position:fixed;inset:0;
  width:100vw;height:100vh;
  z-index:0;display:block;
  pointer-events:none;
}
.bg-overlay{
  position:fixed;inset:0;
  z-index:1;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 30% 30%, rgba(var(--ink-rgb),0.35) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 70%, rgba(var(--ink-rgb),0.2) 0%, transparent 45%),
    radial-gradient(ellipse at 50% 50%, rgba(var(--ink-rgb),0.15) 0%, transparent 70%);
}
.bg-noise{
  position:fixed;inset:0;z-index:1;
  pointer-events:none;
  opacity:0.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat:repeat;background-size:256px 256px;
}

/* ==========================================================================
   Magazine Chrome (top)
   ========================================================================== */
.chrome{
  position:fixed;top:0;left:0;right:0;
  z-index:100;
  display:flex;justify-content:space-between;align-items:center;
  padding:22px 32px;
  background:linear-gradient(180deg, rgba(var(--ink-rgb),0.92) 0%, transparent 100%);
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:0.2em;
  text-transform:uppercase;
}
.chrome .left{display:flex;align-items:center;gap:20px;color:var(--paper);opacity:0.7}
.chrome .left .sep{width:32px;height:1px;background:var(--paper);opacity:0.25}
.chrome .right{display:flex;align-items:center;gap:14px;color:var(--paper)}
.chrome .status-dot{
  width:5px;height:5px;
  border-radius:50%;
  background:var(--paper);
  animation:pulseDot 2s ease-in-out infinite;
}
.chrome .status-dot.paused{animation:none;opacity:0.35}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:0.3}}

/* ==========================================================================
   Main Layout
   ========================================================================== */
.main{
  position:fixed;inset:0;
  z-index:10;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:80px 20px 140px;
}

/* ==========================================================================
   Magazine Rule Lines
   ========================================================================== */
.rule-v{
  position:fixed;
  top:12%;bottom:12%;
  width:1px;
  background:var(--paper);
  opacity:0.06;
  z-index:2;
  pointer-events:none;
}
.rule-v.left{left:6%}
.rule-v.right{right:6%}
.rule-h{
  position:fixed;
  left:6%;right:6%;
  height:1px;
  background:var(--paper);
  opacity:0.04;
  z-index:2;
  pointer-events:none;
}
.rule-h.top{top:18%}
.rule-h.bottom{bottom:15%}

.magazine-tag{
  position:fixed;
  z-index:2;
  pointer-events:none;
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:0.25em;
  text-transform:uppercase;
  color:var(--paper);
  opacity:0.12;
}
.magazine-tag.tl{top:20%;left:6.8%;transform:rotate(-90deg) translateX(-50%);transform-origin:left center}
.magazine-tag.br{bottom:18%;right:6.8%}

/* ==========================================================================
   Vinyl Player
   ========================================================================== */
.player-area{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  width:min(60vmin,380px);height:min(60vmin,380px);
  margin-bottom:22px;
  aspect-ratio:1/1;
}
.vinyl{
  position:relative;width:100%;height:100%;border-radius:50%;
  box-shadow:0 0 0 1px rgba(var(--paper-rgb),0.04),0 30px 90px rgba(0,0,0,0.7);
}
.vinyl-disc{
  position:absolute;inset:0;border-radius:50%;overflow:hidden;
  background-color:#080808;
  animation:spin 2.4s linear infinite;animation-play-state:paused;
}
.vinyl-disc.playing{animation-play-state:running}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* Album Art (center label) */
.album-art{
  position:absolute;top:50%;left:50%;
  width:36%;height:36%;
  transform:translate(-50%,-50%);
  border-radius:50%;overflow:hidden;
  background:var(--ink-tint);
  box-shadow:inset 0 0 40px rgba(0,0,0,0.6),0 0 30px rgba(0,0,0,0.5);
  border:1.5px solid rgba(var(--paper-rgb),0.06);
}
.album-art img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity 0.5s ease}
.album-art::before{
  content:'';position:absolute;z-index:1;
  top:-4px;left:-4px;right:-4px;bottom:-4px;
  border-radius:50%;border:1px solid rgba(var(--paper-rgb),0.03);
  pointer-events:none;
}
.album-art::after{
  content:'';position:absolute;z-index:1;
  top:50%;left:50%;
  width:calc(100% + 14px);height:calc(100% + 14px);
  transform:translate(-50%,-50%);
  border-radius:50%;border:1px solid rgba(0,0,0,0.35);
  pointer-events:none;
}

/* Spindle */
.spindle{
  position:absolute;top:50%;left:50%;
  width:5.5%;height:5.5%;
  transform:translate(-50%,-50%);
  border-radius:50%;z-index:3;
  background:radial-gradient(circle at 35% 35%, #555, #1a1a1a);
  box-shadow:inset 0 2px 6px rgba(0,0,0,0.7);
}
.spindle::after{
  content:'';position:absolute;
  top:50%;left:50%;width:32%;height:32%;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 60% 60%, #222, #050505);
}

/* Sheen */
.vinyl-sheen{
  position:absolute;inset:0;border-radius:50%;
  z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at 30% 25%, rgba(var(--paper-rgb),0.05) 0%, rgba(var(--paper-rgb),0.012) 25%, transparent 55%),
    radial-gradient(ellipse at 75% 70%, rgba(var(--paper-rgb),0.025) 0%, transparent 40%),
    conic-gradient(from 210deg, transparent 0%, rgba(var(--paper-rgb),0.015) 20%, transparent 40%, transparent 60%, rgba(var(--paper-rgb),0.01) 80%, transparent 100%);
}

.vinyl-edge{position:absolute;inset:-2px;border-radius:50%;z-index:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(var(--paper-rgb),0.02),0 0 0 1px rgba(0,0,0,0.4)}
.vinyl-inner-shadow{position:absolute;inset:0;border-radius:50%;z-index:3;pointer-events:none;box-shadow:inset 0 0 60px rgba(0,0,0,0.3)}

/* ==========================================================================
   Tonearm
   ========================================================================== */
.tonearm{
  position:absolute;right:-10%;top:-8%;
  width:44%;height:44%;
  z-index:20;pointer-events:none;
  transition:transform 0.9s cubic-bezier(0.22,1,0.36,1);
  transform-origin:88% 12%;
  transform:rotate(38deg);
}
.tonearm.playing{transform:rotate(12deg)}
.tonearm-base{
  position:absolute;right:-3px;top:-3px;
  width:22px;height:22px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, rgba(var(--paper-rgb),0.5), rgba(var(--paper-rgb),0.08));
  box-shadow:0 2px 16px rgba(0,0,0,0.6),inset 0 1px 0 rgba(var(--paper-rgb),0.1);
  z-index:2;
}
.tonearm-base-inner{
  position:absolute;top:50%;left:50%;
  width:8px;height:8px;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%, rgba(var(--paper-rgb),0.7), rgba(var(--paper-rgb),0.15));
  box-shadow:inset 0 1px 2px rgba(0,0,0,0.3);
}
.tonearm-arm{
  position:absolute;right:10px;top:10px;
  width:82%;height:2.5px;
  background:linear-gradient(90deg, rgba(var(--paper-rgb),0.06) 0%, rgba(var(--paper-rgb),0.35) 25%, rgba(var(--paper-rgb),0.5) 50%, rgba(var(--paper-rgb),0.3) 80%, rgba(var(--paper-rgb),0.08) 100%);
  transform-origin:right center;
  transform:rotate(-24deg) translateX(0);
  border-radius:2px;box-shadow:0 0 6px rgba(0,0,0,0.3);
}
.tonearm-arm::before{
  content:'';position:absolute;left:-2px;top:-1.5px;
  width:15px;height:5.5px;
  background:linear-gradient(180deg, rgba(var(--paper-rgb),0.5), rgba(var(--paper-rgb),0.15));
  border-radius:1px;box-shadow:0 0 4px rgba(0,0,0,0.5);
}
.tonearm-arm::after{
  content:'';position:absolute;left:12px;top:-2.5px;
  width:6px;height:8px;
  background:linear-gradient(180deg, rgba(var(--paper-rgb),0.4), rgba(var(--paper-rgb),0.12));
  border-radius:1px;transform:rotate(5deg);box-shadow:0 0 3px rgba(0,0,0,0.3);
}

/* ==========================================================================
   Song Info — Magazine Headline
   ========================================================================== */
.song-info{text-align:center;margin-bottom:28px;transition:opacity 0.4s ease}
.track-number{
  font-family:var(--mono);
  font-size:10px;letter-spacing:0.28em;
  color:var(--paper);opacity:0.4;
  margin-bottom:8px;
}
.track-title{
  font-family:var(--serif-zh);
  font-size:clamp(24px,4.6vw,36px);
  font-weight:600;
  color:var(--paper);
  letter-spacing:0.04em;
  line-height:1.2;
  margin-bottom:4px;
}
.track-artist{
  font-family:var(--sans);
  font-size:13px;
  font-weight:300;
  color:var(--paper);opacity:0.55;
  letter-spacing:0.12em;
}

/* ==========================================================================
   Progress
   ========================================================================== */
.progress-area{width:min(72vmin,400px);margin-bottom:22px}
.progress-bar{
  position:relative;width:100%;height:1.5px;
  background:rgba(var(--paper-rgb),0.06);
  border-radius:2px;cursor:pointer;overflow:hidden;
  transition:height 0.2s ease;
}
.progress-bar:hover{height:3px}
.progress-fill{
  height:100%;width:0%;
  background:var(--paper);
  border-radius:2px;
  transition:width 0.2s linear;
  position:relative;
}
.progress-fill::after{
  content:'';position:absolute;right:-3px;top:50%;
  width:6px;height:6px;
  border-radius:50%;
  background:var(--paper);
  transform:translateY(-50%) scale(0);
  transition:transform 0.2s ease;
}
.progress-bar:hover .progress-fill::after{transform:translateY(-50%) scale(1)}
.progress-time{
  display:flex;justify-content:space-between;
  margin-top:8px;
  font-family:var(--mono);
  font-size:10px;letter-spacing:0.08em;
  color:var(--paper);opacity:0.35;
}

/* ==========================================================================
   Controls
   ========================================================================== */
.controls{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:28px}
.controls button{
  background:none;border:none;cursor:pointer;
  color:var(--paper);opacity:0.5;
  transition:all 0.25s ease;
  display:flex;align-items:center;justify-content:center;
}
.controls button:hover{opacity:0.9}
.controls button:active{transform:scale(0.92)}
.btn-prev,.btn-next{
  width:38px;height:38px;border-radius:50%;
  background:rgba(var(--paper-rgb),0.04);
  border:1px solid rgba(var(--paper-rgb),0.06);
}
.btn-prev:hover,.btn-next:hover{background:rgba(var(--paper-rgb),0.08)}
.btn-play{
  width:58px;height:58px;border-radius:50%;
  background:rgba(var(--paper-rgb),0.06);
  border:1px solid rgba(var(--paper-rgb),0.1);
}
.btn-play:hover{background:rgba(var(--paper-rgb),0.1);border-color:rgba(var(--paper-rgb),0.15)}
.btn-play-icon{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.btn-play-icon svg{width:22px;height:22px;fill:var(--paper);transition:all 0.3s ease}
.btn-play-icon .pause-icon{display:none}
.btn-play.playing .play-icon{display:none}
.btn-play.playing .pause-icon{display:block}

/* ==========================================================================
   Playlist Dots
   ========================================================================== */
.playlist-indicator{display:flex;align-items:center;justify-content:center;gap:10px}
.playlist-dot{
  width:5px;height:5px;border-radius:50%;
  background:rgba(var(--paper-rgb),0.1);
  transition:all 0.5s cubic-bezier(0.22,1,0.36,1);
  cursor:pointer;
}
.playlist-dot.active{
  background:var(--paper);
  width:7px;height:7px;
}
.playlist-dot:hover{background:rgba(var(--paper-rgb),0.3)}

/* ==========================================================================
   Bottom Magazine Foot
   ========================================================================== */
.foot{
  position:fixed;bottom:0;left:0;right:0;
  z-index:100;
  display:flex;justify-content:space-between;align-items:flex-end;
  padding:16px 32px 18px;
  background:linear-gradient(0deg, rgba(var(--ink-rgb),0.92) 0%, transparent 100%);
  font-family:var(--mono);
  font-size:10px;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--paper);opacity:0.3;
  pointer-events:none;
}
.foot .title{font-family:var(--serif-zh);font-weight:400;letter-spacing:0.05em;opacity:0.5;font-size:11px}

/* ==========================================================================
   Transition Overlay
   ========================================================================== */
.transition-overlay{
  position:fixed;inset:0;z-index:200;
  pointer-events:none;
  background:var(--ink);
  opacity:0;transition:opacity 0.6s ease;
}
.transition-overlay.active{opacity:0.7}

/* ==========================================================================
   Scroll Hint
   ========================================================================== */
.scroll-hint{
  position:fixed;bottom:50px;left:50%;
  transform:translateX(-50%);
  z-index:50;
  display:flex;align-items:center;gap:6px;
  font-family:var(--mono);
  font-size:9px;letter-spacing:0.15em;
  color:var(--paper);opacity:0.25;
  animation:hintPulse 3s ease-in-out infinite;
  pointer-events:none;
}
.scroll-hint svg{width:10px;height:10px;fill:var(--paper);opacity:0.5}
@keyframes hintPulse{0%,100%{opacity:0.15}50%{opacity:0.35}}

/* ==========================================================================
   Responsive
   ========================================================================== */
@media(max-width:480px){
  .chrome{padding:16px 20px;font-size:10px}
  .chrome .left .sep{width:20px}
  .main{padding:70px 16px 120px}
  .player-area{width:min(68vmin,280px);height:min(68vmin,280px);margin-bottom:16px}
  .tonearm{right:-13%;top:-10%;width:48%;height:48%}
  .tonearm-base{width:15px;height:15px;right:0;top:0}
  .tonearm-base-inner{width:5px;height:5px}
  .song-info{margin-bottom:20px}
  .track-artist{font-size:11px}
  .progress-area{width:min(80vmin,300px)}
  .controls{gap:20px}
  .btn-play{width:48px;height:48px}
  .btn-prev,.btn-next{width:32px;height:32px}
  .btn-play-icon svg{width:18px;height:18px}
  .foot{padding:12px 20px 14px;font-size:9px}
  .foot .title{font-size:10px}
  .scroll-hint,.rule-v,.rule-h,.magazine-tag{display:none}
}
@media(max-height:500px){
  .main{flex-direction:row;padding:50px 20px;gap:24px}
  .player-area{width:min(42vh,180px);height:min(42vh,180px);margin-bottom:0}
  .song-info{margin-bottom:0;text-align:left}
  .progress-area{width:100%}
}
@media(prefers-reduced-motion:reduce){
  .vinyl-disc,.scroll-hint,.chrome .status-dot{animation:none !important}
  .tonearm{transition:none !important}
}
</style>
</head>
<body>

<!-- Fluid Canvas Background -->
<canvas id="fluid-bg"></canvas>
<div class="bg-overlay"></div>
<div class="bg-noise"></div>

<!-- Magazine Rule Lines -->
<div class="rule-v left"></div>
<div class="rule-v right"></div>
<div class="rule-h top"></div>
<div class="rule-h bottom"></div>
<div class="magazine-tag tl">Vinyl</div>
<div class="magazine-tag br">Side A</div>

<!-- Transition Overlay -->
<div class="transition-overlay" id="transitionOverlay"></div>

<!-- Magazine Chrome Header -->
<div class="chrome">
  <div class="left">
    <span>✦ Music</span>
    <span class="sep"></span>
    <span id="statusText">PAUSED</span>
  </div>
  <div class="right">
    <span class="status-dot paused" id="statusDot"></span>
  </div>
</div>

<!-- Main -->
<main class="main">

  <!-- Vinyl Player -->
  <div class="player-area">
    <div class="tonearm" id="tonearm">
      <div class="tonearm-base"><div class="tonearm-base-inner"></div></div>
      <div class="tonearm-arm"></div>
    </div>
    <div class="vinyl">
      <div class="vinyl-disc" id="vinylDisc">
        <div class="album-art"><img id="albumCover" src="1.jpg" alt=""></div>
        <div class="spindle"></div>
      </div>
      <div class="vinyl-sheen"></div>
      <div class="vinyl-edge"></div>
      <div class="vinyl-inner-shadow"></div>
    </div>
  </div>

  <!-- Song Info -->
  <div class="song-info" id="songInfo">
    <div class="track-number" id="trackNumber">01 / 05</div>
    <h1 class="track-title" id="trackTitle">别让我放不下</h1>
    <p class="track-artist" id="trackArtist">加载中...</p>
  </div>

  <!-- Progress -->
  <div class="progress-area">
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-time">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn-prev" id="prevBtn" aria-label="上一首">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
    </button>
    <button class="btn-play" id="playBtn" aria-label="播放/暂停">
      <span class="btn-play-icon">
        <svg class="play-icon" viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19" fill="currentColor"/></svg>
        <svg class="pause-icon" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/></svg>
      </span>
    </button>
    <button class="btn-next" id="nextBtn" aria-label="下一首">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
    </button>
  </div>

  <!-- Playlist Dots -->
  <div class="playlist-indicator" id="playlistIndicator"></div>

</main>

<!-- Magazine Foot -->
<div class="foot">
  <span class="title">我的收藏</span>
  <span id="footTime">0:00</span>
</div>

<!-- Audio -->
<audio id="audioPlayer" preload="metadata"></audio>

<script>
// =====================================================================
// Playlist
// =====================================================================
const PLAYLIST = [
  {title:'别让我放不下',artist:'我的收藏',file:'1.mp3',cover:'1.jpg'},
  {title:'Call You Tonight',artist:'我的收藏',file:'2.mp3',cover:'2.jpg'},
  {title:'Angel',artist:'我的收藏',file:'3.mp3',cover:'3.jpg'},
  {title:'Maybe',artist:'我的收藏',file:'4.mp3',cover:'4.jpg'},
  {title:'Take Me Hand',artist:'我的收藏',file:'5.mp3',cover:'5.jpg'},
];

// =====================================================================
// State
// =====================================================================
let currentIndex=0,isPlaying=false,isTransitioning=false;
let touchStartY=0,touchStartX=0,lastScrollTime=0;

// =====================================================================
// DOM
// =====================================================================
const a=document.getElementById('audioPlayer');
const vD=document.getElementById('vinylDisc');
const tA=document.getElementById('tonearm');
const aC=document.getElementById('albumCover');
const tT=document.getElementById('trackTitle');
const tA2=document.getElementById('trackArtist');
const tN=document.getElementById('trackNumber');
const pF=document.getElementById('progressFill');
const cT=document.getElementById('currentTime');
const tT2=document.getElementById('totalTime');
const pB=document.getElementById('playBtn');
const sD=document.getElementById('statusDot');
const sT=document.getElementById('statusText');
const tO=document.getElementById('transitionOverlay');
const pI=document.getElementById('playlistIndicator');

// =====================================================================
// Fluid Canvas Background (歸藏 style organic blobs)
// =====================================================================
const canvas=document.getElementById('fluid-bg');
const ctx=canvas.getContext('2d');
let W,H,t=0;

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
}
window.addEventListener('resize',resize);
resize();

// Blob parameters
const BLOBS=[
  {cx:.25,cy:.3,r:.35,sp:.3,ph:0,amp:.06,sx:.7,sy:.7,seed:1},
  {cx:.72,cy:.65,r:.25,sp:.4,ph:2,amp:.08,sx:.6,sy:.8,seed:2},
  {cx:.55,cy:.2,r:.2,sp:.25,ph:4,amp:.05,sx:.9,sy:.5,seed:3},
  {cx:.3,cy:.7,r:.18,sp:.35,ph:1.5,amp:.04,sx:.8,sy:.9,seed:4},
  {cx:.8,cy:.35,r:.15,sp:.45,ph:3,amp:.07,sx:.5,sy:.6,seed:5},
];

function drawBlob(b){
  const cx=b.cx*W,cy=b.cy*H;
  const baseR=Math.min(W,H)*b.r;
  const amp=baseR*b.amp;
  const n=12; // number of control points
  const pts=[];
  for(let i=0;i<n;i++){
    const a0=(i/n)*Math.PI*2;
    const wobble=Math.sin(t*b.sp+a0*2+b.ph)*amp
               +Math.sin(t*b.sp*0.7+a0*3+b.seed)*amp*0.5
               +Math.sin(t*b.sp*0.4+a0*5+b.seed*2)*amp*0.3;
    const r=baseR+wobble;
    pts.push({x:cx+Math.cos(a0)*r,y:cy+Math.sin(a0)*r});
  }

  ctx.beginPath();
  ctx.moveTo(pts[n-1].x,pts[n-1].y);
  for(let i=0;i<n;i++){
    const p0=pts[(i-1+n)%n];
    const p1=pts[i];
    const p2=pts[(i+1)%n];
    const cp1x=p0.x+(p1.x-p0.x)*0.5;
    const cp1y=p0.y+(p1.y-p0.y)*0.5;
    const cp2x=p1.x-(p2.x-p1.x)*0.1;
    const cp2y=p1.y-(p2.y-p1.y)*0.1;
    ctx.bezierCurveTo(cp1x,cp1y,p1.x,p1.y,cp2x,cp2y);
  }
  ctx.closePath();

  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,baseR*1.5);
  grad.addColorStop(0,`rgba(241,239,234,${0.015+Math.sin(t*0.3+b.ph)*0.005})`);
  grad.addColorStop(0.5,`rgba(241,239,234,${0.008+Math.sin(t*0.2+b.seed)*0.004})`);
  grad.addColorStop(1,`rgba(241,239,234,0)`);
  ctx.fillStyle=grad;
  ctx.fill();

  // Delicate contour lines
  for(let c=0;c<2;c++){
    const offset=(c+1)*baseR*0.1;
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const a0=(i/n)*Math.PI*2;
      const wobble=Math.sin(t*b.sp+a0*2+b.ph+offset*0.01)*(amp*0.6)
                 +Math.sin(t*b.sp*0.7+a0*3+b.seed+offset*0.015)*(amp*0.3);
      const r=baseR+wobble+offset+Math.sin(t*0.5+c)*3;
      const x=cx+Math.cos(a0)*r,y=cy+Math.sin(a0)*r;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle=`rgba(241,239,234,${0.008+Math.sin(t*0.4+b.seed+c)*0.004})`;
    ctx.lineWidth=0.5;
    ctx.stroke();
  }
}

function animate(){
  ctx.clearRect(0,0,W,H);
  t+=0.008;
  BLOBS.forEach(drawBlob);
  requestAnimationFrame(animate);
}
animate();

// =====================================================================
// Vinyl Texture
// =====================================================================
function genVinyl(sz){
  const c=document.createElement('canvas');c.width=c.height=sz;
  const x=c.getContext('2d');const cx=cy=sz/2,R=sz/2;
  const bg=x.createRadialGradient(cx,cy,0,cx,cy,R);
  bg.addColorStop(0,'#222');bg.addColorStop(.08,'#181818');bg.addColorStop(.18,'#111');
  bg.addColorStop(.3,'#0d0d0d');bg.addColorStop(.5,'#0a0a0a');bg.addColorStop(.8,'#070707');bg.addColorStop(1,'#040404');
  x.fillStyle=bg;x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.fill();
  const iR=R*.19,oR=R*.96;
  for(let r=oR;r>iR;){x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);
    const d=(oR-r)/(oR-iR);const sp=.5+d*.6;const br=.006+(1-d)*.03;
    x.strokeStyle=`rgba(0,0,0,${Math.min(br,.035)})`;x.lineWidth=.3+(1-d)*.15;x.stroke();r-=sp;}
  [.88,.76,.58,.38].forEach(b=>{for(let r=R*(b+.03);r>R*b;r-=.35){
    x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.strokeStyle='rgba(0,0,0,.02)';x.lineWidth=.18;x.stroke()}});
  const hg=x.createRadialGradient(cx*.3,cy*.3,0,cx,cy,R);
  hg.addColorStop(0,'rgba(241,239,234,0)');hg.addColorStop(.4,'rgba(241,239,234,0)');
  hg.addColorStop(.6,'rgba(241,239,234,.005)');hg.addColorStop(.8,'rgba(241,239,234,.007)');hg.addColorStop(1,'rgba(241,239,234,0)');
  x.fillStyle=hg;x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.fill();
  const id=x.getImageData(0,0,sz,sz);const d=id.data;
  for(let i=0;i<d.length;i+=8){
    const n=Math.sin(i*.0017)*1.5+Math.cos(i*.0013)*1.2+Math.sin(i*.0021)*.8;
    d[i]+=n;d[i+1]+=n*.7;d[i+2]+=n*.5}
  x.putImageData(id,0,0);
  return c.toDataURL();
}
vD.style.backgroundImage=`url('${genVinyl(800)}')`;
vD.style.backgroundSize='cover';
vD.style.animationDuration='2.4s';

// =====================================================================
// Playlist Dots
// =====================================================================
function renderDots(){
  pI.innerHTML='';
  PLAYLIST.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='playlist-dot'+(i===currentIndex?' active':'');
    d.addEventListener('click',()=>{if(i!==currentIndex&&!isTransitioning)switchTo(i)});
    pI.appendChild(d);
  });
}
function updDots(){pI.querySelectorAll('.playlist-dot').forEach((d,i)=>d.classList.toggle('active',i===currentIndex))}

// =====================================================================
// Format
// =====================================================================
function fmt(s){if(isNaN(s)||s===Infinity)return'0:00';return Math.floor(s/60)+':'+(Math.floor(s%60)+'').padStart(2,'0')}

// =====================================================================
// Load Track
// =====================================================================
function loadTrk(idx,skip){
  const tr=PLAYLIST[idx];
  a.src=tr.file;tT.textContent=tr.title;tA2.textContent=tr.artist;
  tN.textContent=(idx+1+'').padStart(2,'0')+' / '+(PLAYLIST.length+'').padStart(2,'0');
  updDots();pF.style.width='0%';cT.textContent='0:00';tT2.textContent='0:00';
  if(skip){aC.src=tr.cover;aC.style.opacity='1'}
  else{
    aC.style.opacity='0';
    const img=new Image();
    img.onload=()=>{aC.src=tr.cover;aC.style.opacity='1'};
    img.onerror=()=>{aC.src=tr.cover;aC.style.opacity='1'};
    img.src=tr.cover;
  }
  a.load();
}

// =====================================================================
// Switch Track
// =====================================================================
function switchTo(idx){
  if(isTransitioning||idx<0||idx>=PLAYLIST.length||idx===currentIndex&&a.src)return;
  isTransitioning=true;const wp=isPlaying;
  tO.classList.add('active');
  setTimeout(()=>{a.pause();currentIndex=idx;loadTrk(currentIndex);
    setTimeout(()=>{tO.classList.remove('active');
      setTimeout(()=>{isTransitioning=false;wp?play():updUI()},300)},150)},250);
}

// =====================================================================
// Play/Pause
// =====================================================================
function play(){
  const p=a.play();
  if(p!==undefined)p.then(()=>{
    isPlaying=true;vD.classList.add('playing');tA.classList.add('playing');
    pB.classList.add('playing');sD.classList.remove('paused');sT.textContent='PLAYING';
  }).catch(()=>{isPlaying=false;updUI()});
}
function pause(){isPlaying=false;a.pause();
  vD.classList.remove('playing');tA.classList.remove('playing');
  pB.classList.remove('playing');sD.classList.add('paused');sT.textContent='PAUSED'}
function toggle(){isPlaying?pause():play()}
function updUI(){isPlaying?(
  vD.classList.add('playing'),tA.classList.add('playing'),pB.classList.add('playing'),
  sD.classList.remove('paused'),sT.textContent='PLAYING'
):(
  vD.classList.remove('playing'),tA.classList.remove('playing'),pB.classList.remove('playing'),
  sD.classList.add('paused'),sT.textContent='PAUSED'
)}

// =====================================================================
// Next/Prev
// =====================================================================
function next(){
  const n=(currentIndex+1)%PLAYLIST.length;
  // Smooth cover transition
  aC.style.transition='opacity 0.15s ease';
  aC.style.opacity='0';
  setTimeout(()=>{switchTo(n);setTimeout(()=>{aC.style.opacity='1'},200)},50);
}
function prev(){
  if(a.currentTime>3){a.currentTime=0;pF.style.width='0%';cT.textContent='0:00';return}
  const p=(currentIndex-1+PLAYLIST.length)%PLAYLIST.length;
  aC.style.transition='opacity 0.15s ease';aC.style.opacity='0';
  setTimeout(()=>{switchTo(p);setTimeout(()=>{aC.style.opacity='1'},200)},50);
}

// =====================================================================
// Audio Events
// =====================================================================
a.addEventListener('loadedmetadata',()=>{tT2.textContent=fmt(a.duration)});
a.addEventListener('timeupdate',()=>{
  if(a.duration){pF.style.width=(a.currentTime/a.duration*100)+'%';cT.textContent=fmt(a.currentTime);document.getElementById('footTime').textContent=fmt(a.currentTime)}
});
a.addEventListener('ended',next);

// =====================================================================
// Progress Seek
// =====================================================================
const pr=document.getElementById('progressBar');let drag=false;
function seek(e){if(!a.duration)return;const r=pr.getBoundingClientRect();const x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));a.currentTime=x*a.duration;pF.style.width=(x*100)+'%'}
pr.addEventListener('mousedown',e=>{drag=true;seek(e)});
document.addEventListener('mousemove',e=>{if(drag)seek(e)});
document.addEventListener('mouseup',()=>{drag=false});
pr.addEventListener('touchstart',e=>{drag=true;seek(e.touches[0])});
document.addEventListener('touchmove',e=>{if(drag)seek(e.touches[0])});
document.addEventListener('touchend',()=>{drag=false});

// =====================================================================
// Scroll
// =====================================================================
document.addEventListener('wheel',e=>{e.preventDefault();const n=Date.now();if(n-lastScrollTime<800||isTransitioning)return;lastScrollTime=n;e.deltaY>0?next():prev()},{passive:false});
document.addEventListener('touchstart',e=>{touchStartY=e.touches[0].clientY;touchStartX=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(isTransitioning)return;const dy=touchStartY-e.changedTouches[0].clientY;if(Math.abs(dy)>50)dy>0?next():prev()},{passive:true});

// =====================================================================
// Keyboard
// =====================================================================
document.addEventListener('keydown',e=>{
  switch(e.code){case'Space':e.preventDefault();toggle();break;
    case'ArrowRight':case'ArrowDown':e.preventDefault();next();break;
    case'ArrowLeft':case'ArrowUp':e.preventDefault();prev();break}
  if(e.shiftKey)switch(e.code){case'ArrowUp':e.preventDefault();a.volume=Math.min(1,a.volume+.1);break;case'ArrowDown':e.preventDefault();a.volume=Math.max(0,a.volume-.1);break}
});

// =====================================================================
// Buttons
// =====================================================================
pB.addEventListener('click',toggle);
document.getElementById('nextBtn').addEventListener('click',next);
document.getElementById('prevBtn').addEventListener('click',prev);

// =====================================================================
// Init
// =====================================================================
function init(){
  renderDots();loadTrk(0,true);
  for(let i=1;i<PLAYLIST.length;i++){const img=new Image();img.src=PLAYLIST[i].cover}
  document.addEventListener('click',()=>document.querySelector('.scroll-hint').style.opacity='0',{once:true});
  document.addEventListener('touchstart',()=>document.querySelector('.scroll-hint').style.opacity='0',{once:true});
  document.addEventListener('wheel',()=>document.querySelector('.scroll-hint').style.opacity='0',{once:true});
}
init();
</script>
</body>
</html>
