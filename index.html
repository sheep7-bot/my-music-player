<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>我的音乐收藏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   CSS Variables — Black & White Magazine Palette
   ========================================================================== */
:root {
  --bg-deep: #050505;
  --bg-surface: #0d0d0d;
  --bg-elevated: #141414;
  --glass-bg: rgba(255,255,255,0.03);
  --glass-border: rgba(255,255,255,0.06);
  --glass-blur: 20px;
  --text-primary: #f0f0f0;
  --text-secondary: #999999;
  --text-muted: #555555;
  --accent: #ffffff;
  --accent-dim: rgba(255,255,255,0.3);
  --vinyl-base: #0a0a0a;
  --shadow-deep: 0 40px 100px rgba(0,0,0,0.8);
  --shadow-soft: 0 8px 32px rgba(0,0,0,0.4);
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-full: 50%;
  --font-serif: 'Playfair Display','Georgia','Times New Roman',serif;
  --font-sans: 'Inter','SF Pro Display','PingFang SC','Microsoft YaHei','Helvetica Neue',system-ui,-apple-system,sans-serif;
  --font-mono: 'SF Mono','Fira Code','Consolas',monospace;
}

/* ==========================================================================
   Reset & Base
   ========================================================================== */
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html,body {
  height: 100%;
  overflow: hidden;
  font-family: var(--font-sans);
  background: var(--bg-deep);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  user-select: none;
  -webkit-user-select: none;
}

/* ==========================================================================
   Background — Magazine Black
   ========================================================================== */
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}
.bg-gradient {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 30% 40%, rgba(255,255,255,0.03) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 60%, rgba(255,255,255,0.02) 0%, transparent 50%),
    linear-gradient(180deg, #050505 0%, #0a0a0a 50%, #050505 100%);
}

/* Magazine ruled lines (subtle) */
.bg-ruled {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.06;
}
.bg-ruled::before {
  content: '';
  position: absolute;
  left: 8%; right: 8%;
  top: 15%; bottom: 15%;
  border: 1px solid rgba(255,255,255,0.3);
  border-top: none;
  border-bottom: none;
}
.bg-ruled::after {
  content: '';
  position: absolute;
  top: 50%; left: 8%; right: 8%;
  height: 1px;
  background: rgba(255,255,255,0.08);
}

/* Noise overlay */
.bg-noise {
  position: absolute;
  inset: 0;
  opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 256px 256px;
  pointer-events: none;
}

/* ==========================================================================
   Header — Magazine Masthead
   ========================================================================== */
.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 36px;
  background: linear-gradient(180deg, rgba(5,5,5,0.95) 0%, transparent 100%);
}
.header-title {
  font-family: var(--font-serif);
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.2em;
  color: var(--text-secondary);
  text-transform: uppercase;
}
.header-title em {
  font-style: italic;
  color: var(--text-primary);
}
.header-indicator {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 400;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.header-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulseDot 2s ease-in-out infinite;
}
.header-dot.paused {
  animation: none;
  background: var(--text-muted);
}
@keyframes pulseDot {
  0%,100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* ==========================================================================
   Main Layout
   ========================================================================== */
.main {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1;
  padding: 80px 20px 150px;
}

/* ==========================================================================
   Vinyl Player — Premium Black Circle
   ========================================================================== */
.player-area {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: min(65vmin, 400px);
  height: min(65vmin, 400px);
  margin-bottom: 28px;
  aspect-ratio: 1 / 1;
}

/* ---- Vinyl Container ---- */
.vinyl {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.03),
    0 0 0 4px rgba(0,0,0,0.3),
    0 20px 80px rgba(0,0,0,0.7),
    0 40px 120px rgba(0,0,0,0.4);
}

/* ---- The rotating disc ---- */
.vinyl-disc {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  overflow: hidden;
  background-color: #080808;
  animation: spin 1.8s linear infinite;
  animation-play-state: paused;
}
.vinyl-disc.playing {
  animation-play-state: running;
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* ===== Album Art (center label) ===== */
.album-art {
  position: absolute;
  top: 50%; left: 50%;
  width: 36%;
  height: 36%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  overflow: hidden;
  background: #1a1a1a;
  box-shadow:
    inset 0 0 40px rgba(0,0,0,0.6),
    0 0 30px rgba(0,0,0,0.5);
  border: 1.5px solid rgba(255,255,255,0.06);
}
.album-art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: opacity 0.5s ease;
}
/* Decorative concentric rings around album art */
.album-art::before {
  content: '';
  position: absolute;
  z-index: 1;
  top: -4px; left: -4px; right: -4px; bottom: -4px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.04);
  pointer-events: none;
}
.album-art::after {
  content: '';
  position: absolute;
  z-index: 1;
  top: 50%; left: 50%;
  width: calc(100% + 12px);
  height: calc(100% + 12px);
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.3);
  pointer-events: none;
}

/* ---- Spindle Hole ---- */
.spindle {
  position: absolute;
  top: 50%; left: 50%;
  width: 5.5%;
  height: 5.5%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  z-index: 3;
  background: radial-gradient(circle at 35% 35%, #555, #1a1a1a);
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.7);
}
.spindle::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 32%;
  height: 32%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle at 60% 60%, #222, #050505);
}

/* ---- Vinyl Sheen (dynamic light reflection) ---- */
.vinyl-sheen {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  z-index: 2;
  pointer-events: none;
  background:
    /* Main specular highlight */
    radial-gradient(
      ellipse at 32% 28%,
      rgba(255,255,255,0.06) 0%,
      rgba(255,255,255,0.015) 25%,
      transparent 55%
    ),
    /* Secondary edge reflection */
    radial-gradient(
      ellipse at 75% 70%,
      rgba(255,255,255,0.03) 0%,
      transparent 40%
    ),
    /* Subtle rim light */
    conic-gradient(
      from 210deg,
      transparent 0%,
      rgba(255,255,255,0.02) 20%,
      transparent 40%,
      transparent 60%,
      rgba(255,255,255,0.015) 80%,
      transparent 100%
    );
}

/* ---- Vinyl Edge Highlight (thickness illusion) ---- */
.vinyl-edge {
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  z-index: 0;
  pointer-events: none;
  background: transparent;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.02),
    0 0 0 1px rgba(0,0,0,0.4);
}

/* ---- Vinyl Shadow Ring (inner shadow for depth) ---- */
.vinyl-inner-shadow {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  z-index: 3;
  pointer-events: none;
  box-shadow: inset 0 0 60px rgba(0,0,0,0.3);
}

/* ==========================================================================
   Tonearm — Polished Silver
   ========================================================================== */
.tonearm {
  position: absolute;
  right: -12%;
  top: -10%;
  width: 48%;
  height: 48%;
  z-index: 20;
  pointer-events: none;
  transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
  transform-origin: 88% 12%;
  transform: rotate(38deg);
}
.tonearm.playing {
  transform: rotate(13deg);
}
.tonearm-base {
  position: absolute;
  right: -3px;
  top: -3px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ccc, #555);
  box-shadow:
    0 2px 16px rgba(0,0,0,0.6),
    inset 0 1px 0 rgba(255,255,255,0.15);
  z-index: 2;
}
.tonearm-base-inner {
  position: absolute;
  top: 50%; left: 50%;
  width: 9px;
  height: 9px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ddd, #666);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
}
.tonearm-arm {
  position: absolute;
  right: 10px;
  top: 10px;
  width: 82%;
  height: 3px;
  background: linear-gradient(90deg,
    rgba(180,180,180,0.08) 0%,
    rgba(160,160,160,0.4) 25%,
    rgba(140,140,140,0.6) 50%,
    rgba(100,100,100,0.4) 80%,
    rgba(80,80,80,0.1) 100%
  );
  transform-origin: right center;
  transform: rotate(-24deg) translateX(0);
  border-radius: 2px;
  box-shadow: 0 0 6px rgba(0,0,0,0.3);
}
.tonearm-arm::before {
  content: '';
  position: absolute;
  left: -2px;
  top: -1.5px;
  width: 16px;
  height: 6px;
  background: linear-gradient(180deg, #999, #555);
  border-radius: 1px;
  box-shadow: 0 0 4px rgba(0,0,0,0.5);
}
.tonearm-arm::after {
  content: '';
  position: absolute;
  left: 13px;
  top: -3px;
  width: 7px;
  height: 9px;
  background: linear-gradient(180deg, #888, #444);
  border-radius: 1px;
  transform: rotate(6deg);
  box-shadow: 0 0 3px rgba(0,0,0,0.3);
}

/* ==========================================================================
   Song Info — Magazine Typography
   ========================================================================== */
.song-info {
  text-align: center;
  margin-bottom: 32px;
  transition: opacity 0.4s ease;
}
.track-number {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.2em;
  color: var(--text-muted);
  margin-bottom: 10px;
  text-transform: uppercase;
}
.track-title {
  font-family: var(--font-serif);
  font-size: clamp(26px, 5vw, 38px);
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: 0.01em;
  line-height: 1.2;
  margin-bottom: 6px;
  transition: opacity 0.3s ease;
}
.track-artist {
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 300;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

/* ==========================================================================
   Progress — Minimalist
   ========================================================================== */
.progress-area {
  width: min(76vmin, 440px);
  margin-bottom: 24px;
}
.progress-bar {
  position: relative;
  width: 100%;
  height: 1.5px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  cursor: pointer;
  overflow: hidden;
  transition: height 0.2s ease;
}
.progress-bar:hover {
  height: 3px;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.2s linear;
  position: relative;
}
.progress-fill::after {
  content: '';
  position: absolute;
  right: -3px;
  top: 50%;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  transform: translateY(-50%) scale(0);
  transition: transform 0.2s ease;
}
.progress-bar:hover .progress-fill::after {
  transform: translateY(-50%) scale(1);
}
.progress-time {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-size: 10px;
  font-weight: 400;
  color: var(--text-muted);
  font-family: var(--font-mono);
  letter-spacing: 0.05em;
}

/* ==========================================================================
   Controls — Minimal Black
   ========================================================================== */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
  margin-bottom: 32px;
}
.controls button {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-secondary);
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}
.controls button:hover {
  color: var(--text-primary);
}
.controls button:active {
  transform: scale(0.92);
}
.btn-prev, .btn-next {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
}
.btn-prev:hover, .btn-next:hover {
  background: rgba(255,255,255,0.06);
}
.btn-play {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  position: relative;
}
.btn-play:hover {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.15);
}
.btn-play-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%; height: 100%;
}
.btn-play-icon svg {
  width: 22px;
  height: 22px;
  fill: var(--text-primary);
  transition: all 0.3s ease;
}
.btn-play-icon .pause-icon { display: none; }
.btn-play.playing .play-icon { display: none; }
.btn-play.playing .pause-icon { display: block; }

/* ==========================================================================
   Playlist Indicator — Thin Rings
   ========================================================================== */
.playlist-indicator {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.playlist-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  cursor: pointer;
}
.playlist-dot.active {
  background: var(--accent);
  width: 7px;
  height: 7px;
  box-shadow: 0 0 12px rgba(255,255,255,0.15);
}
.playlist-dot:hover {
  background: rgba(255,255,255,0.25);
}

/* ==========================================================================
   Scroll / Swipe Hint
   ========================================================================== */
.scroll-hint {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.1em;
  opacity: 0.4;
  animation: hintPulse 3s ease-in-out infinite;
  pointer-events: none;
  text-transform: uppercase;
}
.scroll-hint svg {
  width: 12px;
  height: 12px;
  fill: var(--text-muted);
  opacity: 0.6;
}
@keyframes hintPulse {
  0%,100% { opacity: 0.2; }
  50% { opacity: 0.5; }
}

/* ==========================================================================
   Transition Overlay
   ========================================================================== */
.transition-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  pointer-events: none;
  background: #000;
  opacity: 0;
  transition: opacity 0.6s ease;
}
.transition-overlay.active {
  opacity: 0.6;
}

/* ==========================================================================
   Magazine Decorative Elements
   ========================================================================== */
.magazine-accent {
  position: fixed;
  z-index: 0;
  pointer-events: none;
  opacity: 0.04;
}
.magazine-accent.top-left {
  top: 12%;
  left: 4%;
  width: 1px;
  height: 20vh;
  background: #fff;
}
.magazine-accent.bottom-right {
  bottom: 10%;
  right: 6%;
  width: 60px;
  height: 1px;
  background: #fff;
}

/* ==========================================================================
   Responsive
   ========================================================================== */
@media (max-width: 480px) {
  .header { padding: 18px 20px; }
  .header-title { font-size: 11px; }
  .header-indicator { font-size: 10px; }
  .main { padding: 70px 16px 130px; }
  .player-area {
    width: min(72vmin, 300px);
    height: min(72vmin, 300px);
    margin-bottom: 20px;
  }
  .tonearm {
    right: -14%;
    top: -12%;
    width: 52%;
    height: 52%;
  }
  .tonearm-base { width: 16px; height: 16px; right: 0; top: 0; }
  .tonearm-base-inner { width: 6px; height: 6px; }
  .song-info { margin-bottom: 22px; }
  .track-number { font-size: 9px; }
  .track-artist { font-size: 11px; }
  .progress-area { width: min(85vmin, 320px); }
  .controls { gap: 22px; }
  .btn-play { width: 50px; height: 50px; }
  .btn-prev, .btn-next { width: 34px; height: 34px; }
  .btn-play-icon svg { width: 18px; height: 18px; }
  .scroll-hint { display: none; }
  .magazine-accent { display: none; }
}

@media (max-height: 500px) {
  .main {
    flex-direction: row;
    padding: 50px 20px;
    gap: 24px;
  }
  .player-area {
    width: min(45vh, 200px);
    height: min(45vh, 200px);
    margin-bottom: 0;
  }
  .song-info { margin-bottom: 0; text-align: left; }
  .progress-area { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  .vinyl-disc, .scroll-hint, .header-dot { animation: none !important; }
  .tonearm { transition: none !important; }
}
</style>
</head>
<body>

<!-- ======================================================================
     Background
     ====================================================================== -->
<div class="bg">
  <div class="bg-gradient"></div>
  <div class="bg-ruled"></div>
  <div class="bg-noise"></div>
</div>

<!-- Magazine decorative accents -->
<div class="magazine-accent top-left"></div>
<div class="magazine-accent bottom-right"></div>

<!-- Transition Overlay -->
<div class="transition-overlay" id="transitionOverlay"></div>

<!-- ======================================================================
     Header — Magazine Masthead
     ====================================================================== -->
<header class="header">
  <span class="header-title"><em>M</em>usic</span>
  <div class="header-indicator">
    <span class="header-dot paused" id="statusDot"></span>
    <span id="statusText">PAUSED</span>
  </div>
</header>

<!-- ======================================================================
     Main Player
     ====================================================================== -->
<main class="main">

  <!-- Vinyl Player -->
  <div class="player-area">
    <div class="tonearm" id="tonearm">
      <div class="tonearm-base">
        <div class="tonearm-base-inner"></div>
      </div>
      <div class="tonearm-arm"></div>
    </div>
    <div class="vinyl" id="vinyl">
      <div class="vinyl-disc" id="vinylDisc">
        <div class="album-art">
          <img id="albumCover" src="1.jpg" alt="Album Cover">
        </div>
        <div class="spindle"></div>
      </div>
      <div class="vinyl-sheen"></div>
      <div class="vinyl-edge"></div>
      <div class="vinyl-inner-shadow"></div>
    </div>
  </div>

  <!-- Song Info — Magazine Headline -->
  <div class="song-info" id="songInfo">
    <div class="track-number" id="trackNumber">01 / 05</div>
    <h1 class="track-title" id="trackTitle">曲目 1</h1>
    <p class="track-artist" id="trackArtist">加载中...</p>
  </div>

  <!-- Progress -->
  <div class="progress-area">
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-time">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn-prev" id="prevBtn" aria-label="上一首">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/>
      </svg>
    </button>
    <button class="btn-play" id="playBtn" aria-label="播放/暂停">
      <span class="btn-play-icon">
        <svg class="play-icon" viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19" fill="currentColor"/></svg>
        <svg class="pause-icon" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/></svg>
      </span>
    </button>
    <button class="btn-next" id="nextBtn" aria-label="下一首">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/>
      </svg>
    </button>
  </div>

  <!-- Playlist Dots -->
  <div class="playlist-indicator" id="playlistIndicator"></div>

</main>

<!-- Scroll Hint -->
<div class="scroll-hint" id="scrollHint">
  <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 12v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="9" y1="22" x2="15" y2="22"/></svg>
  <span>Scroll to change</span>
</div>

<!-- Audio Element -->
<audio id="audioPlayer" preload="metadata"></audio>

<script>
// =========================================================================
// Playlist
// =========================================================================
const PLAYLIST = [
  { title: '别让我放不下', artist: '我的收藏', file: '1.mp3', cover: '1.jpg' },
  { title: 'Call You Tonight', artist: '我的收藏', file: '2.mp3', cover: '2.jpg' },
  { title: 'Angel', artist: '我的收藏', file: '3.mp3', cover: '3.jpg' },
  { title: 'Maybe', artist: '我的收藏', file: '4.mp3', cover: '4.jpg' },
  { title: 'Take Me Hand', artist: '我的收藏', file: '5.mp3', cover: '5.jpg' },
];

// =========================================================================
// State
// =========================================================================
let currentIndex = 0;
let isPlaying = false;
let isTransitioning = false;
let touchStartY = 0;
let touchStartX = 0;
let lastScrollTime = 0;

// =========================================================================
// DOM Refs
// =========================================================================
const audio = document.getElementById('audioPlayer');
const vinylDisc = document.getElementById('vinylDisc');
const tonearm = document.getElementById('tonearm');
const albumCover = document.getElementById('albumCover');
const trackTitle = document.getElementById('trackTitle');
const trackArtist = document.getElementById('trackArtist');
const trackNumber = document.getElementById('trackNumber');
const progressFill = document.getElementById('progressFill');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const playBtn = document.getElementById('playBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const transitionOverlay = document.getElementById('transitionOverlay');
const playlistIndicator = document.getElementById('playlistIndicator');
const scrollHint = document.getElementById('scrollHint');

// =========================================================================
// Generate Premium Vinyl Texture
// =========================================================================
function generateVinylTexture(size) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const cx = size / 2;
  const cy = size / 2;
  const radius = size / 2;

  // ——— Base gradient (ultra dark with subtle center light) ———
  const baseGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
  baseGrad.addColorStop(0, '#222');
  baseGrad.addColorStop(0.08, '#181818');
  baseGrad.addColorStop(0.18, '#111');
  baseGrad.addColorStop(0.3, '#0d0d0d');
  baseGrad.addColorStop(0.5, '#0a0a0a');
  baseGrad.addColorStop(0.8, '#070707');
  baseGrad.addColorStop(1, '#040404');
  ctx.fillStyle = baseGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();

  // ——— Main grooves (dense toward edge, slightly wider near label) ———
  const innerR = radius * 0.19;
  const outerR = radius * 0.97;

  // Groove spacing varies: denser at outer edge
  for (let r = outerR; r > innerR; ) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    const distFromEdge = (outerR - r) / (outerR - innerR);
    const spacing = 0.5 + distFromEdge * 0.6;
    const brightness = 0.006 + (1 - distFromEdge) * 0.03;
    ctx.strokeStyle = `rgba(0,0,0,${Math.min(brightness, 0.035)})`;
    ctx.lineWidth = 0.3 + (1 - distFromEdge) * 0.15;
    ctx.stroke();
    r -= spacing;
  }

  // ——— Audio band markings (slightly denser bands) ———
  const bands = [
    { from: 0.88, to: 0.91 },
    { from: 0.76, to: 0.79 },
    { from: 0.58, to: 0.61 },
    { from: 0.38, to: 0.41 },
  ];
  bands.forEach(band => {
    for (let r = radius * band.to; r > radius * band.from; r -= 0.35) {
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(0,0,0,0.02)';
      ctx.lineWidth = 0.18;
      ctx.stroke();
    }
  });

  // ——— Specular highlight on grooves (subtle light catch) ———
  const hlGrad = ctx.createRadialGradient(
    cx * 0.3, cy * 0.3, 0,
    cx, cy, radius
  );
  hlGrad.addColorStop(0, 'rgba(255,255,255,0)');
  hlGrad.addColorStop(0.4, 'rgba(255,255,255,0)');
  hlGrad.addColorStop(0.6, 'rgba(255,255,255,0.005)');
  hlGrad.addColorStop(0.8, 'rgba(255,255,255,0.008)');
  hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hlGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();

  // ——— Subtle pixel noise ———
  const imageData = ctx.getImageData(0, 0, size, size);
  const data = imageData.data;
  for (let i = 0; i < data.length; i += 8) {
    const noise = (Math.sin(i * 0.0017) * 1.5 + Math.cos(i * 0.0013) * 1.2 + Math.sin(i * 0.0021) * 0.8);
    data[i] += noise;
    data[i+1] += noise * 0.7;
    data[i+2] += noise * 0.5;
  }
  ctx.putImageData(imageData, 0, 0);

  return canvas.toDataURL();
}

// Generate and apply vinyl texture
const VINYL_SIZE = 800;
const vinylTexture = generateVinylTexture(VINYL_SIZE);
vinylDisc.style.backgroundImage = `url('${vinylTexture}')`;
vinylDisc.style.backgroundSize = 'cover';

// Reduce spin speed for premium feel (33⅓ RPM vibe)
vinylDisc.style.animationDuration = '2.2s';

// =========================================================================
// Playlist Dots
// =========================================================================
function renderPlaylistDots() {
  playlistIndicator.innerHTML = '';
  PLAYLIST.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'playlist-dot' + (i === currentIndex ? ' active' : '');
    dot.addEventListener('click', () => { if (i !== currentIndex && !isTransitioning) switchToTrack(i); });
    playlistIndicator.appendChild(dot);
  });
}

function updatePlaylistDots() {
  const dots = playlistIndicator.querySelectorAll('.playlist-dot');
  dots.forEach((dot, i) => dot.classList.toggle('active', i === currentIndex));
}

// =========================================================================
// Time Formatting
// =========================================================================
function formatTime(seconds) {
  if (isNaN(seconds) || seconds === Infinity) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

// =========================================================================
// Load Track
// =========================================================================
function loadTrack(index, skipTransition) {
  const track = PLAYLIST[index];
  audio.src = track.file;
  trackTitle.textContent = track.title;
  trackArtist.textContent = track.artist;
  trackNumber.textContent = `${(index + 1).toString().padStart(2, '0')} / ${PLAYLIST.length.toString().padStart(2, '0')}`;
  updatePlaylistDots();

  progressFill.style.width = '0%';
  currentTimeEl.textContent = '0:00';
  totalTimeEl.textContent = '0:00';

  if (skipTransition) {
    albumCover.src = track.cover;
    albumCover.style.opacity = '1';
  } else {
    albumCover.style.opacity = '0';
    const newImg = new Image();
    newImg.onload = () => { albumCover.src = track.cover; albumCover.style.opacity = '1'; };
    newImg.onerror = () => { albumCover.src = track.cover; albumCover.style.opacity = '1'; };
    newImg.src = track.cover;
  }

  audio.load();
}

// =========================================================================
// Switch Track
// =========================================================================
function switchToTrack(index, direction) {
  if (isTransitioning) return;
  if (index < 0 || index >= PLAYLIST.length) return;
  if (index === currentIndex && audio.src) return;

  isTransitioning = true;
  const wasPlaying_live = isPlaying;

  transitionOverlay.classList.add('active');

  setTimeout(() => {
    audio.pause();
    currentIndex = index;
    loadTrack(currentIndex);

    setTimeout(() => {
      transitionOverlay.classList.remove('active');
      setTimeout(() => {
        isTransitioning = false;
        if (wasPlaying_live) play();
        else updateUIState();
      }, 300);
    }, 150);
  }, 250);
}

// =========================================================================
// Play / Pause
// =========================================================================
function play() {
  const playPromise = audio.play();
  if (playPromise !== undefined) {
    playPromise.then(() => {
      isPlaying = true;
      vinylDisc.classList.add('playing');
      tonearm.classList.add('playing');
      playBtn.classList.add('playing');
      statusDot.classList.remove('paused');
      statusText.textContent = 'PLAYING';
      scrollHint.style.transition = 'opacity 0.8s ease';
      scrollHint.style.opacity = '0';
    }).catch(() => {
      isPlaying = false;
      updateUIState();
    });
  }
}

function pause() {
  isPlaying = false;
  audio.pause();
  vinylDisc.classList.remove('playing');
  tonearm.classList.remove('playing');
  playBtn.classList.remove('playing');
  statusDot.classList.add('paused');
  statusText.textContent = 'PAUSED';
}

function togglePlay() { isPlaying ? pause() : play(); }

function updateUIState() {
  if (isPlaying) {
    vinylDisc.classList.add('playing');
    tonearm.classList.add('playing');
    playBtn.classList.add('playing');
    statusDot.classList.remove('paused');
    statusText.textContent = 'PLAYING';
  } else {
    vinylDisc.classList.remove('playing');
    tonearm.classList.remove('playing');
    playBtn.classList.remove('playing');
    statusDot.classList.add('paused');
    statusText.textContent = 'PAUSED';
    scrollHint.style.opacity = '0.4';
  }
}

// =========================================================================
// Next / Previous
// =========================================================================
function nextTrack() {
  const next = (currentIndex + 1) % PLAYLIST.length;
  switchToTrack(next);
}

function prevTrack() {
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    progressFill.style.width = '0%';
    currentTimeEl.textContent = '0:00';
    return;
  }
  const prev = (currentIndex - 1 + PLAYLIST.length) % PLAYLIST.length;
  switchToTrack(prev);
}

// =========================================================================
// Audio Events
// =========================================================================
audio.addEventListener('loadedmetadata', () => {
  totalTimeEl.textContent = formatTime(audio.duration);
});

audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    progressFill.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
    currentTimeEl.textContent = formatTime(audio.currentTime);
  }
});

audio.addEventListener('ended', nextTrack);

// =========================================================================
// Progress Seek
// =========================================================================
const progressBar = document.getElementById('progressBar');
let isDragging = false;

function seekFromEvent(e) {
  if (!audio.duration) return;
  const rect = progressBar.getBoundingClientRect();
  const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  audio.currentTime = x * audio.duration;
  progressFill.style.width = `${x * 100}%`;
}

progressBar.addEventListener('mousedown', (e) => { isDragging = true; seekFromEvent(e); });
document.addEventListener('mousemove', (e) => { if (isDragging) seekFromEvent(e); });
document.addEventListener('mouseup', () => { isDragging = false; });

progressBar.addEventListener('touchstart', (e) => { isDragging = true; seekFromEvent(e.touches[0]); });
document.addEventListener('touchmove', (e) => { if (isDragging) seekFromEvent(e.touches[0]); });
document.addEventListener('touchend', () => { isDragging = false; });

// =========================================================================
// Scroll → Track Switch
// =========================================================================
document.addEventListener('wheel', (e) => {
  e.preventDefault();
  const now = Date.now();
  if (now - lastScrollTime < 800 || isTransitioning) return;
  lastScrollTime = now;
  e.deltaY > 0 ? nextTrack() : prevTrack();
}, { passive: false });

// =========================================================================
// Touch Swipe → Track Switch
// =========================================================================
document.addEventListener('touchstart', (e) => {
  touchStartY = e.touches[0].clientY;
  touchStartX = e.touches[0].clientX;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (isTransitioning) return;
  const deltaY = touchStartY - e.changedTouches[0].clientY;
  const deltaX = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(deltaY) > Math.abs(deltaX) && Math.abs(deltaY) > 50) {
    deltaY > 0 ? nextTrack() : prevTrack();
  }
}, { passive: true });

// =========================================================================
// Keyboard
// =========================================================================
document.addEventListener('keydown', (e) => {
  switch (e.code) {
    case 'Space': e.preventDefault(); togglePlay(); break;
    case 'ArrowRight': case 'ArrowDown': e.preventDefault(); nextTrack(); break;
    case 'ArrowLeft': case 'ArrowUp': e.preventDefault(); prevTrack(); break;
  }
  if (e.shiftKey) {
    switch (e.code) {
      case 'ArrowUp': e.preventDefault(); audio.volume = Math.min(1, audio.volume + 0.1); break;
      case 'ArrowDown': e.preventDefault(); audio.volume = Math.max(0, audio.volume - 0.1); break;
    }
  }
});

// =========================================================================
// Buttons
// =========================================================================
playBtn.addEventListener('click', togglePlay);
document.getElementById('nextBtn').addEventListener('click', nextTrack);
document.getElementById('prevBtn').addEventListener('click', prevTrack);

// =========================================================================
// Cover Image Fallback
// =========================================================================
albumCover.addEventListener('error', () => {
  albumCover.style.objectFit = 'none';
  albumCover.style.background = '#222';
});

// =========================================================================
// Init
// =========================================================================
function init() {
  renderPlaylistDots();
  loadTrack(0, true);

  // Preload remaining covers
  for (let i = 1; i < PLAYLIST.length; i++) {
    const img = new Image();
    img.src = PLAYLIST[i].cover;
  }

  const hideHint = () => {
    scrollHint.style.transition = 'opacity 0.8s ease';
    scrollHint.style.opacity = '0';
  };
  document.addEventListener('click', hideHint, { once: true });
  document.addEventListener('touchstart', hideHint, { once: true });
  document.addEventListener('wheel', hideHint, { once: true });

  console.log(`✦ ${PLAYLIST.length} tracks loaded`);
}

init();
</script>

</body>
</html>
